[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicoder"
version = "0.1.0"
description = "一个极简、可读、可 fork 的终端 AI coding agent —— Claude Code 核心思想的 Python 教学实现"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wisdom-pan" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
minicoder = "minicoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["minicoder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
